name: SuiraBox Release Profile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-profile:
    name: Minimal release ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils make grub-pc-bin grub-common xorriso mtools

      - name: Build minimal release ISO
        run: sh scripts/build_release_iso.sh

      - name: Verify Multiboot2 kernel
        run: grub-file --is-x86-multiboot2 build/suirabox-release.elf

      - name: Verify ELF headers
        run: |
          readelf -h build/suirabox-release.elf | grep -q 'Class:.*ELF64'
          readelf -h build/sb-desktop.elf | grep -q 'Class:.*ELF64'
          if readelf -S build/suirabox-release.elf | grep -q '\.symtab'; then
            echo 'release kernel still contains a symbol table'
            exit 1
          fi
          if readelf -S build/sb-desktop.elf | grep -q '\.symtab'; then
            echo 'release desktop still contains a symbol table'
            exit 1
          fi

      - name: Verify minimal ISO payload
        run: sh scripts/check_base_image.sh build/release-iso

      - name: Report artifact sizes
        run: |
          stat -c '%n %s bytes' build/suirabox-release.iso build/suirabox-release.elf build/sb-desktop.elf
