name: SuiraBox Shell Host Test

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  shell-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile shell host test
        run: gcc -std=c11 -Wall -Wextra -Werror -DSB_HOST_TEST -Iuserspace tests/shell_host_test.c userspace/shell.c -o /tmp/shell-host-test
      - name: Run shell host test
        run: /tmp/shell-host-test
      - name: Compile launcher host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Iuserspace tests/launcher_host_test.c userspace/launcher.c -o /tmp/launcher-host-test
      - name: Run launcher host test
        run: /tmp/launcher-host-test
      - name: Compile Desktop Shell host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Iuserspace tests/desktop_shell_host_test.c userspace/desktop_shell.c userspace/launcher.c -o /tmp/desktop-shell-host-test
      - name: Run Desktop Shell host test
        run: /tmp/desktop-shell-host-test
