name: SuiraBox Resource Policy Host Test

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  resource-policy-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile resource policy host test
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Iuserspace \
            tests/resource_policy_host_test.c userspace/resource_policy.c \
            -o build/resource-policy-host-test
      - name: Run resource policy host test
        run: build/resource-policy-host-test
