name: SuiraBox User Context Host Test

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  user-context:
    name: x86_64 user context contract host test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile user context
        run: gcc -Wall -Wextra -Werror -std=c11 -ffreestanding -fno-builtin -Ikernel/arch/x86_64 -Ikernel/mm tests/user_context_host_test.c kernel/arch/x86_64/user_context.c -o user-context-host-test
      - name: Run user context host test
        run: ./user-context-host-test
