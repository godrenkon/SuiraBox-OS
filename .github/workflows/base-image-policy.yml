name: SuiraBox Base Image Policy

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  base-image-policy:
    name: Minimal ISO payload policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-common xorriso mtools
      - name: Build full ISO
        run: make iso
      - name: Prepare minimal base tree
        run: |
          rm -rf build/base-iso
          cp -a build/iso build/base-iso
          rm -f build/base-iso/boot/sb-app-settings.elf
          rm -f build/base-iso/boot/sb-app-files.elf
          rm -f build/base-iso/boot/sb-app-terminal.elf
          cp boot/grub-base.cfg build/base-iso/boot/grub/grub.cfg
      - name: Verify minimal base tree
        run: sh scripts/check_base_image.sh build/base-iso
