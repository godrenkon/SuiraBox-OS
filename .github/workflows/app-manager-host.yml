name: Application Manager Host Test

on:
  push:
  pull_request:

jobs:
  app-manager-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run host test
        run: |
          gcc -Wall -Wextra -Werror -Ikernel -Ikernel/mm -Ikernel/arch/x86_64 \
            tests/app_manager_host_test.c kernel/app_manager.c -o /tmp/app-manager-host-test
          /tmp/app-manager-host-test
