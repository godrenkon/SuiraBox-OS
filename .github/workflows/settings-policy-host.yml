name: SuiraBox Settings Policy Host Test

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  settings-policy-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile settings policy host test
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Iuserspace \
            tests/settings_policy_host_test.c \
            userspace/settings_policy.c userspace/resource_policy.c \
            -o build/settings-policy-host-test
      - name: Run settings policy host test
        run: build/settings-policy-host-test
