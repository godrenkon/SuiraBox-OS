name: SuiraBox Settings View Host Test

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  settings-view-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile settings view host test
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Iuserspace \
            tests/settings_view_host_test.c \
            userspace/settings_view.c userspace/settings_policy.c \
            userspace/resource_policy.c \
            -o build/settings-view-host-test
      - name: Run settings view host test
        run: build/settings-view-host-test
