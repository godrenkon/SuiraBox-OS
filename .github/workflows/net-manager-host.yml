name: SuiraBox Network Manager Host Test

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  net-manager-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Network Manager host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Ikernel tests/net_manager_host_test.c kernel/net_manager.c -o /tmp/net-manager-host-test
      - name: Run Network Manager host test
        run: /tmp/net-manager-host-test
