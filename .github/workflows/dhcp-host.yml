name: SuiraBox DHCP Host Test

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  dhcp-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile DHCP host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Ikernel tests/dhcp_host_test.c kernel/dhcp.c -o /tmp/dhcp-host-test
      - name: Run DHCP host test
        run: /tmp/dhcp-host-test
