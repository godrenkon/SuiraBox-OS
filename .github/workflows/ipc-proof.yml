name: SuiraBox IPC Proof

on:
  workflow_run:
    workflows: ["SuiraBox CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  ipc-proof:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download QEMU smoke artifact
        uses: actions/download-artifact@v4
        with:
          name: suirabox-kernel
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify IPC lifecycle markers
        run: |
          set -euo pipefail
          test -f artifact/qemu.log

          grep -F "Pipe: userspace pipe handles created" artifact/qemu.log
          grep -F "Userspace: PIPE handle lifecycle OK" artifact/qemu.log

          grep -F "Event: userspace manual-reset event created" artifact/qemu.log
          grep -F "Event: unsignaled wait blocked with timeout" artifact/qemu.log
          grep -F "Event: SIGNAL woke blocked user task" artifact/qemu.log
          grep -F "Userspace: cross-thread EVENT wake OK" artifact/qemu.log
          grep -F "Userspace: EVENT wait/timeout lifecycle OK" artifact/qemu.log

          grep -F "MessageQueue: userspace queue handle created" artifact/qemu.log
          grep -F "MessageQueue: message enqueued from userspace" artifact/qemu.log
          grep -F "MessageQueue: short receive buffer preserved message" artifact/qemu.log
          grep -F "MessageQueue: message copied to userspace" artifact/qemu.log

          grep -F "SharedMemory: userspace object handle created" artifact/qemu.log
          grep -F "SharedMemory: writable mapping installed" artifact/qemu.log
          grep -F "SharedMemory: read-only alias installed" artifact/qemu.log
          grep -F "SharedMemory: mapping released" artifact/qemu.log
          grep -F "Userspace: shared memory alias/permission lifecycle OK" artifact/qemu.log

          grep -F "Service: named local endpoint registered" artifact/qemu.log
          grep -F "Service: client connected by name" artifact/qemu.log
          grep -F "Service: message sent through local transport" artifact/qemu.log
          grep -F "Service: message received through local transport" artifact/qemu.log
          grep -F "Userspace: child local service round-trip OK" artifact/qemu.log
          grep -F "Userspace: cross-process local service round-trip OK" artifact/qemu.log

          python3 - <<'PY'
          from pathlib import Path

          log = Path("artifact/qemu.log").read_text(errors="replace")
          sequences = {
              "pipe": [
                  "Pipe: userspace pipe handles created",
                  "Pipe: data written from userspace",
                  "Pipe: data read to userspace",
                  "Pipe: EOF observed after writer close",
                  "Userspace: PIPE handle lifecycle OK",
              ],
              "event-timeout-and-wake": [
                  "Event: userspace manual-reset event created",
                  "Event: unsignaled wait blocked with timeout",
                  "Scheduler: timed blocked task woke",
                  "Thread: additional user thread created",
                  "Event: blocking wait registered",
                  "Event: SIGNAL woke blocked user task",
                  "Userspace: secondary thread signaled event",
                  "Userspace: cross-thread EVENT wake OK",
                  "Event: signaled wait completed immediately",
                  "Event: manual-reset event reset",
                  "Userspace: EVENT wait/timeout lifecycle OK",
              ],
              "message-queue": [
                  "MessageQueue: userspace queue handle created",
                  "MessageQueue: message enqueued from userspace",
                  "MessageQueue: short receive buffer preserved message",
                  "MessageQueue: message copied to userspace",
              ],
              "shared-memory": [
                  "SharedMemory: userspace object handle created",
                  "SharedMemory: writable mapping installed",
                  "SharedMemory: read-only alias installed",
                  "SharedMemory: mapping released",
                  "Userspace: shared memory alias/permission lifecycle OK",
              ],
              "local-service-cross-process": [
                  "Service: named local endpoint registered",
                  "Service: client connected by name",
                  "Service: message sent through local transport",
                  "Service: message received through local transport",
                  "Userspace: child local service round-trip OK",
                  "Userspace: cross-process local service round-trip OK",
              ],
          }

          for name, markers in sequences.items():
              cursor = -1
              for marker in markers:
                  position = log.find(marker, cursor + 1)
                  if position < 0:
                      raise SystemExit(f"missing ordered {name} marker: {marker}")
                  cursor = position
              print(f"ordered IPC proof OK: {name}")
          PY
