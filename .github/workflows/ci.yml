name: SuiraBox CI

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            qemu-system-x86

      - name: Prepare persistent FAT32 test disk
        run: |
          mkdir -p build
          truncate -s 64M build/test-disk.img
          mformat -F -i build/test-disk.img ::

      - name: Build ISO
        run: make

      - name: Check Core footprint and ISO resource boundary
        run: python3 tools/check_core_footprint.py

      - name: Validate Multiboot2 image
        run: make check

      - name: Inspect kernel layout
        run: |
          nm -nS build/suirabox.elf | grep -E 'stack_(bottom|top)|pml4|pdpt|pd$|bitmap|page_count|free_count|next_page' || true

      - name: Boot smoke test
        run: |
          set -o pipefail
          timeout 20s qemu-system-x86_64 \
            -m 256M \
            -cdrom build/suirabox.iso \
            -drive file=build/test-disk.img,format=raw,if=ide \
            -nic user,model=e1000 \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Kernel initialized." qemu.log
          grep -F "PCI: scanning bus/device/function space..." qemu.log
          grep -F "PCI: scan complete." qemu.log
          grep -F "Memory: PMM bootstrap free pages =" qemu.log
          grep -F "Memory: VMM map/translate/unmap OK" qemu.log
          grep -F "Memory: kernel heap alloc/free OK" qemu.log
          grep -F "CPU: GDT/TSS ready" qemu.log
          grep -F "Scheduler: task table/round-robin selection OK" qemu.log
          grep -F "Process/Syscall: model and dispatch OK" qemu.log
          grep -F "Storage: real block device + FAT32 mount OK" qemu.log
          grep -F "Syscall: int 0x80 user gate ready" qemu.log
          grep -F "Userspace: SB Desktop ELF + address-space + user thread preparation OK" qemu.log
          grep -F "Timer: IRQ0 enabled" qemu.log
          grep -F "Phase 1 bootstrap complete." qemu.log
          grep -F "Userspace: entering SB Desktop ring3" qemu.log
          grep -F "Userspace: ring3 syscall reached" qemu.log
          grep -F "Userspace: GUI framebuffer draw reached" qemu.log

      - name: Framebuffer smoke test
        run: |
          set -o pipefail
          timeout 20s qemu-system-x86_64 \
            -m 256M \
            -cdrom build/suirabox.iso \
            -drive file=build/test-disk.img,format=raw,if=ide \
            -nic user,model=e1000 \
            -serial file:qemu-gui.log \
            -display none \
            -vga std \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu-gui-host.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Display: framebuffer ready" qemu-gui.log
          grep -F "Display: framebuffer mapped" qemu-gui.log
          grep -F "Display: framebuffer clear OK" qemu-gui.log
          grep -F "Desktop: kernel fallback surface rendered" qemu-gui.log
          grep -F "Storage: real block device + FAT32 mount OK" qemu-gui.log
          grep -F "Userspace: GUI framebuffer draw reached" qemu-gui.log
          grep -F "Memory: VMM map/translate/unmap OK" qemu-gui.log

      - name: Upload kernel artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: suirabox-kernel
          path: |
            build/suirabox.iso
            build/suirabox.elf
            build/test-disk.img
            qemu.log
            qemu-gui.log
            qemu-gui-host.log
          if-no-files-found: warn
