name: SuiraBox CI

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            qemu-system-x86

      - name: Build ISO
        run: make STORAGE_DURABILITY_PROOF=1

      - name: Validate image and host tests
        run: |
          make check STORAGE_DURABILITY_PROOF=1
          python3 -m unittest discover -s tests -p 'storage_image_check_test.py'

      - name: Inspect kernel layout
        run: |
          nm -nS build/suirabox.elf | grep -E 'stack_(bottom|top)|pml4|pdpt|pd$|bitmap|page_count|free_count|next_page' || true

      - name: Boot smoke test
        run: |
          set -o pipefail

          truncate -s 64M build/runtime-fat32.img
          printf 'SUIRABOX-RUNTIME-FAT32\n' > build/runtime.txt
          mformat -i build/runtime-fat32.img -F ::
          mcopy -i build/runtime-fat32.img build/runtime.txt ::RUNTIME.TXT
          python3 tests/storage_image_check.py seed build/runtime-fat32.img

          timeout 20s qemu-system-x86_64 \
            -m 256M \
            -boot d \
            -drive file=build/runtime-fat32.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/suirabox.iso \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu.log || test ${PIPESTATUS[0]} -eq 124

          python3 tests/qemu_log_check.py qemu.log --storage-proof
          python3 tests/storage_image_check.py verify build/runtime-fat32.img

      - name: Verify durability proof is opt-in
        run: |
          make STORAGE_DURABILITY_PROOF=0 build/suirabox.elf
          if nm build/suirabox.elf | grep -q 'sb_storage_durability_stage'; then
            echo 'normal kernel still contains durability fixture'
            exit 1
          fi
          make STORAGE_DURABILITY_PROOF=1 build/suirabox.elf
          nm build/suirabox.elf | grep -q 'sb_storage_durability_stage'

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suirabox-kernel
          if-no-files-found: ignore
          path: |
            build/suirabox.iso
            build/suirabox.elf
            build/user-hello.elf
            build/user-child.elf
            build/runtime-fat32.img
            qemu.log

  ipc-proof:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download QEMU smoke artifact
        uses: actions/download-artifact@v4
        with:
          name: suirabox-kernel
          path: artifact

      - name: Verify IPC lifecycle
        run: python3 tests/ipc_log_check.py artifact/qemu.log
