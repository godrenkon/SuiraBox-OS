name: SuiraBox CI

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            qemu-system-x86

      - name: Build ISO
        run: make

      - name: Validate Multiboot2 image
        run: make check

      - name: Create QEMU test disk
        run: |
          dd if=/dev/zero of=testdisk.img bs=1M count=16 status=none
          printf 'SUIRABOX-DISK-TEST' | dd of=testdisk.img bs=1 seek=0 conv=notrunc status=none

      - name: Boot smoke test
        run: |
          set -o pipefail
          timeout 8s qemu-system-x86_64 \
            -cdrom build/suirabox.iso \
            -drive file=testdisk.img,format=raw,if=ide,index=0,media=disk \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Kernel initialized." qemu.log
          grep -F "PCI: scanning bus/device/function space..." qemu.log
          grep -F "PCI: scan complete." qemu.log
          grep -F "Storage: ATA device registered" qemu.log
          grep -F "Storage: real disk read OK" qemu.log
          grep -F "Userspace: ELF + address-space + stack preparation OK" qemu.log
          grep -F "Syscall: int 0x80 user gate ready" qemu.log
          grep -F "Phase 1 bootstrap complete." qemu.log

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suirabox-kernel
          path: |
            build/suirabox.iso
            build/suirabox.elf
            qemu.log
