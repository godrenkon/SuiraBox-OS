name: SuiraBox CI

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools \
            qemu-system-x86

      - name: Build ISO
        run: make STORAGE_DURABILITY_PROOF=1

      - name: Validate image and host tests
        run: |
          make check STORAGE_DURABILITY_PROOF=1
          python3 -m unittest discover -s tests -p '*image_check_test.py'

      - name: Inspect kernel layout
        run: |
          nm -nS build/suirabox.elf | grep -E 'stack_(bottom|top)|pml4|pdpt|pd$|bitmap|page_count|free_count|next_page' || true

      - name: Boot smoke test
        run: |
          set -o pipefail

          truncate -s 64M build/runtime-fat32.img
          printf 'SUIRABOX-RUNTIME-FAT32\n' > build/runtime.txt
          mformat -i build/runtime-fat32.img -F ::
          mcopy -i build/runtime-fat32.img build/runtime.txt ::RUNTIME.TXT
          printf 'SUIRABOX-GUARD-UNCHANGED\n' > build/guard.txt
          mcopy -i build/runtime-fat32.img build/guard.txt ::GUARD.TXT
          python3 tests/fat32_directory_growth_image_check.py seed build/runtime-fat32.img build/root-directory-seed.bin
          python3 tests/storage_image_check.py seed build/runtime-fat32.img

          timeout 20s qemu-system-x86_64 \
            -m 256M \
            -boot d \
            -drive file=build/runtime-fat32.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/suirabox.iso \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu.log || test ${PIPESTATUS[0]} -eq 124

          python3 tests/qemu_log_check.py qemu.log --storage-proof
          python3 tests/storage_image_check.py verify build/runtime-fat32.img
          mcopy -i build/runtime-fat32.img ::RUNTIME.TXT build/runtime-persisted.txt
          python3 -c 'from pathlib import Path; Path("build/runtime-expected.txt").write_bytes(b"SUIRABOX-WRITTEN-FAT32\n" + b"SUIRABOX-APPEND\n" * 48)'
          cmp build/runtime-expected.txt build/runtime-persisted.txt
          mcopy -i build/runtime-fat32.img ::GUARD.TXT build/guard-persisted.txt
          cmp build/guard.txt build/guard-persisted.txt
          mcopy -i build/runtime-fat32.img ::NEWFILE.TXT build/created-persisted.txt
          printf 'SUIRABOX-CREATED-FAT32\n' > build/created-expected.txt
          cmp build/created-expected.txt build/created-persisted.txt
          mcopy -i build/runtime-fat32.img ::SAVES/WORLDS/LEVEL.DAT build/world-persisted.txt
          printf 'SUIRABOX-WORLD-DATA\n' > build/world-expected.txt
          cmp build/world-expected.txt build/world-persisted.txt
          python3 tests/fat32_mkdir_image_check.py build/runtime-fat32.img build/root-directory-seed.bin
          # Dirty-session evidence stays on the original. Validate offline
          # repair and fsck on a disposable copy of this CI file-backed disk.
          cp build/runtime-fat32.img build/runtime-fsck.img
          fsck.fat -a build/runtime-fsck.img || test $? -eq 1
          fsck.fat -n build/runtime-fsck.img
          mcopy -i build/runtime-fsck.img ::SAVES/WORLDS/LEVEL.DAT build/world-fsck.txt
          cmp build/world-expected.txt build/world-fsck.txt

      - name: Verify durability proof is opt-in
        run: |
          make STORAGE_DURABILITY_PROOF=0 build/suirabox.elf userspace
          if nm build/suirabox.elf | grep -q 'sb_storage_durability_stage'; then
            echo 'normal kernel still contains durability fixture'
            exit 1
          fi
          if nm build/user-hello.elf | grep -q 'runtime_fat32_write_probe'; then
            echo 'normal userspace still contains file write fixture'
            exit 1
          fi
          if nm build/user-hello.elf | grep -q 'runtime_fat32_create_probe'; then
            echo 'normal userspace still contains file creation fixture'
            exit 1
          fi
          make STORAGE_DURABILITY_PROOF=1 build/suirabox.elf userspace
          nm build/suirabox.elf | grep -q 'sb_storage_durability_stage'
          nm build/user-hello.elf | grep -q 'runtime_fat32_write_probe'
          nm build/user-hello.elf | grep -q 'runtime_fat32_create_probe'

      - name: Boot recovery-required FAT32 volumes read-only
        run: |
          set -o pipefail
          make BUILD=build/recovery STORAGE_DURABILITY_PROOF=0 STORAGE_RECOVERY_PROOF=1
          nm build/recovery/user-hello.elf | grep -q 'runtime_fat32_recovery_probe'
          for mode in dirty hard-error status-mismatch; do
            image="build/recovery/$mode.img"
            snapshot="build/recovery/$mode.sha256"
            truncate -s 64M "$image"
            mformat -i "$image" -F ::
            mcopy -i "$image" build/runtime.txt ::RUNTIME.TXT
            python3 tests/fat32_recovery_image_check.py seed "$image" "$snapshot" "$mode"
            timeout 20s qemu-system-x86_64 \
              -m 256M -boot d \
              -drive file="$image",format=raw,if=ide,index=0,media=disk,cache=writeback \
              -cdrom build/recovery/suirabox.iso \
              -serial stdio -display none -no-reboot -no-shutdown \
              2>&1 | tee "qemu-recovery-$mode.log" || test ${PIPESTATUS[0]} -eq 124
            python3 tests/qemu_log_check.py "qemu-recovery-$mode.log" --recovery-proof
            python3 tests/fat32_recovery_image_check.py verify "$image" "$snapshot"
          done
          make BUILD=build/recovery STORAGE_DURABILITY_PROOF=0 STORAGE_RECOVERY_PROOF=0 userspace
          if nm build/recovery/user-hello.elf | grep -q 'runtime_fat32_recovery_probe'; then
            echo 'normal userspace still contains recovery rejection fixture'
            exit 1
          fi

      - name: Prove pre-mutation dirty marker survives unsynced stop and reboot
        run: |
          set -o pipefail
          make BUILD=build/dirty STORAGE_DURABILITY_PROOF=0 STORAGE_DIRTY_PROOF=1
          nm build/dirty/user-hello.elf | grep -q 'runtime_fat32_dirty_probe'
          truncate -s 64M build/dirty/runtime.img
          mformat -i build/dirty/runtime.img -F ::
          mcopy -i build/dirty/runtime.img build/runtime.txt ::RUNTIME.TXT
          python3 tests/fat32_dirty_image_check.py prepare build/dirty/runtime.img build/dirty/expected.sha256
          timeout 20s qemu-system-x86_64 \
            -m 256M -boot d \
            -drive file=build/dirty/runtime.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/dirty/suirabox.iso \
            -serial stdio -display none -no-reboot -no-shutdown \
            2>&1 | tee qemu-dirty-checkpoint.log || test ${PIPESTATUS[0]} -eq 124
          grep -q 'Userspace: FAT32 dirty marker durable before unsynced create checkpoint' qemu-dirty-checkpoint.log
          if grep -qE 'Exception:|FAILED|recovery required' qemu-dirty-checkpoint.log; then exit 1; fi
          python3 tests/fat32_dirty_image_check.py verify build/dirty/runtime.img build/dirty/expected.sha256
          timeout 20s qemu-system-x86_64 \
            -m 256M -boot d \
            -drive file=build/dirty/runtime.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/recovery/suirabox.iso \
            -serial stdio -display none -no-reboot -no-shutdown \
            2>&1 | tee qemu-dirty-reboot.log || test ${PIPESTATUS[0]} -eq 124
          python3 tests/qemu_log_check.py qemu-dirty-reboot.log --recovery-proof
          python3 tests/fat32_recovery_image_check.py verify build/dirty/runtime.img build/dirty/expected.sha256
          make BUILD=build/dirty STORAGE_DURABILITY_PROOF=0 STORAGE_DIRTY_PROOF=0 userspace
          if nm build/dirty/user-hello.elf | grep -q 'runtime_fat32_dirty_probe'; then exit 1; fi

      - name: Prove clean unmount persists unsynced data and permits writable reboot
        run: |
          set -o pipefail
          make BUILD=build/clean STORAGE_DURABILITY_PROOF=0 STORAGE_CLEAN_PROOF=1
          nm build/clean/user-hello.elf | grep -q 'runtime_fat32_clean_probe'
          truncate -s 64M build/clean/runtime.img
          mformat -i build/clean/runtime.img -F ::
          mcopy -i build/clean/runtime.img build/runtime.txt ::RUNTIME.TXT
          cp build/clean/runtime.img build/clean/seed.img
          timeout 20s qemu-system-x86_64 \
            -m 256M -boot d \
            -drive file=build/clean/runtime.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/clean/suirabox.iso \
            -serial stdio -display none -no-reboot -no-shutdown \
            2>&1 | tee qemu-clean-unmount.log || test ${PIPESTATUS[0]} -eq 124
          python3 tests/qemu_log_check.py qemu-clean-unmount.log --clean-proof
          python3 tests/fat32_clean_image_check.py build/clean/runtime.img build/clean/seed.img
          # FAT32 allocation deliberately invalidates FSInfo free-count hints.
          # Let fsck refresh those hints only in a disposable inspection copy.
          cp build/clean/runtime.img build/clean/fsck.img
          fsck.fat -a build/clean/fsck.img || test $? -eq 1
          fsck.fat -n build/clean/fsck.img
          mcopy -i build/clean/runtime.img ::CLEAN.TXT build/clean/persisted.txt
          printf 'SUIRABOX CLEAN\n' > build/clean/expected.txt
          cmp build/clean/persisted.txt build/clean/expected.txt
          sha256sum build/clean/runtime.img > build/clean/after-unmount.sha256
          timeout 20s qemu-system-x86_64 \
            -m 256M -boot d \
            -drive file=build/clean/runtime.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/clean/suirabox.iso \
            -serial stdio -display none -no-reboot -no-shutdown \
            2>&1 | tee qemu-clean-reboot.log || test ${PIPESTATUS[0]} -eq 124
          python3 tests/qemu_log_check.py qemu-clean-reboot.log --clean-reboot-proof
          python3 tests/fat32_clean_image_check.py build/clean/runtime.img build/clean/seed.img
          sha256sum -c build/clean/after-unmount.sha256
          make BUILD=build/clean STORAGE_DURABILITY_PROOF=0 STORAGE_CLEAN_PROOF=0 userspace
          if nm build/clean/user-hello.elf | grep -q 'runtime_fat32_clean_probe'; then exit 1; fi

      - name: Prove staged-file rename, held handles and writable reboot
        run: |
          set -o pipefail
          make BUILD=build/rename STORAGE_DURABILITY_PROOF=0 STORAGE_RENAME_PROOF=1
          nm build/rename/user-hello.elf | grep -q 'runtime_fat32_rename_probe'
          truncate -s 64M build/rename/runtime.img
          mformat -i build/rename/runtime.img -F ::
          mcopy -i build/rename/runtime.img build/runtime.txt ::RUNTIME.TXT
          cp build/rename/runtime.img build/rename/seed.img
          timeout 20s qemu-system-x86_64 \
            -m 256M -boot d \
            -drive file=build/rename/runtime.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/rename/suirabox.iso \
            -serial stdio -display none -no-reboot -no-shutdown \
            2>&1 | tee qemu-rename.log || test ${PIPESTATUS[0]} -eq 124
          python3 tests/qemu_log_check.py qemu-rename.log --rename-proof
          python3 tests/fat32_rename_image_check.py build/rename/runtime.img build/rename/seed.img
          mcopy -i build/rename/runtime.img ::WORLD.DAT build/rename/world.txt
          printf 'SUIRABOX RENAMED\n!' > build/rename/expected.txt
          cmp build/rename/world.txt build/rename/expected.txt
          mcopy -i build/rename/runtime.img ::SAVES/WORLD.DAT build/rename/nested.txt
          printf 'SUIRABOX RENAMED\n' > build/rename/nested-expected.txt
          cmp build/rename/nested.txt build/rename/nested-expected.txt
          if mcopy -i build/rename/runtime.img ::STAGED.TMP build/rename/stale.txt; then exit 1; fi
          if mcopy -i build/rename/runtime.img ::SAVES/STAGED.TMP build/rename/stale-nested.txt; then exit 1; fi
          cp build/rename/runtime.img build/rename/fsck.img
          fsck.fat -a build/rename/fsck.img || test $? -eq 1
          fsck.fat -n build/rename/fsck.img
          sha256sum build/rename/runtime.img > build/rename/after-rename.sha256
          timeout 20s qemu-system-x86_64 \
            -m 256M -boot d \
            -drive file=build/rename/runtime.img,format=raw,if=ide,index=0,media=disk,cache=writeback \
            -cdrom build/rename/suirabox.iso \
            -serial stdio -display none -no-reboot -no-shutdown \
            2>&1 | tee qemu-rename-reboot.log || test ${PIPESTATUS[0]} -eq 124
          python3 tests/qemu_log_check.py qemu-rename-reboot.log --rename-reboot-proof
          python3 tests/fat32_rename_image_check.py build/rename/runtime.img build/rename/seed.img
          sha256sum -c build/rename/after-rename.sha256
          make BUILD=build/rename STORAGE_DURABILITY_PROOF=0 STORAGE_RENAME_PROOF=0 userspace
          if nm build/rename/user-hello.elf | grep -q 'runtime_fat32_rename_probe'; then exit 1; fi

      - name: Prove userspace display presentation against QEMU screen capture
        run: |
          make BUILD=build/display STORAGE_DURABILITY_PROOF=0 DISPLAY_PROOF=1
          nm build/display/user-hello.elf | grep -q 'sb_display_probe'
          truncate -s 64M build/display/runtime.img
          mformat -i build/display/runtime.img -F ::
          mcopy -i build/display/runtime.img build/runtime.txt ::RUNTIME.TXT
          sha256sum build/display/runtime.img > build/display/before-display.sha256
          python3 tests/qemu_display_capture.py build/display
          python3 tests/qemu_log_check.py build/display/display.log --display-proof
          python3 tests/display_image_check.py build/display/screen.ppm --text-proof
          sha256sum -c build/display/before-display.sha256
          make BUILD=build/display STORAGE_DURABILITY_PROOF=0 DISPLAY_PROOF=0 userspace
          if nm build/display/user-hello.elf | grep -q 'sb_display_probe'; then exit 1; fi
          if nm build/display/user-hello.elf | grep -q 'sb_text_display_proof'; then exit 1; fi

      - name: Capture normal desktop without proof mode
        run: |
          make BUILD=build/boot-text STORAGE_DURABILITY_PROOF=0 DISPLAY_PROOF=0
          if nm build/boot-text/user-hello.elf | grep -q 'sb_text_display_proof'; then exit 1; fi
          truncate -s 64M build/boot-text/runtime.img
          mformat -i build/boot-text/runtime.img -F ::
          mcopy -i build/boot-text/runtime.img build/runtime.txt ::RUNTIME.TXT
          sha256sum build/boot-text/runtime.img > build/boot-text/before.sha256
          python3 tests/qemu_display_capture.py build/boot-text --boot-text
          python3 tests/qemu_log_check.py build/boot-text/display.log --shell
          python3 tests/shell_image_check.py build/boot-text/screen.ppm --home
          sha256sum -c build/boot-text/before.sha256

      # Keyboard injection goes through QEMU hardware and the actual IRQ path.
      - name: Inject PS/2 keys and prove visible userspace editing
        run: |
          make BUILD=build/input STORAGE_DURABILITY_PROOF=0 DISPLAY_PROOF=0 INPUT_PROOF=1
          nm build/input/user-hello.elf | grep -q 'sb_keyboard_proof_event'
          truncate -s 64M build/input/runtime.img
          mformat -i build/input/runtime.img -F ::
          mcopy -i build/input/runtime.img build/runtime.txt ::RUNTIME.TXT
          sha256sum build/input/runtime.img > build/input/before.sha256
          python3 tests/qemu_display_capture.py build/input --input-proof
          python3 tests/qemu_log_check.py build/input/display.log --input-proof
          python3 tests/display_image_check.py build/input/before.ppm --boot-text
          python3 tests/display_image_check.py build/input/screen.ppm --input-proof
          sha256sum -c build/input/before.sha256
          make BUILD=build/input STORAGE_DURABILITY_PROOF=0 INPUT_PROOF=0 userspace
          if nm build/input/user-hello.elf | grep -q 'sb_keyboard_proof_event'; then exit 1; fi

      - name: Navigate desktop and verify real VFS directory screens
        run: |
          make BUILD=build/shell STORAGE_DURABILITY_PROOF=0 DISPLAY_PROOF=0 INPUT_PROOF=0
          truncate -s 64M build/shell/runtime.img
          mformat -i build/shell/runtime.img -F ::
          mcopy -i build/shell/runtime.img build/runtime.txt ::RUNTIME.TXT
          sha256sum build/shell/runtime.img > build/shell/before.sha256
          python3 tests/qemu_display_capture.py build/shell --shell
          python3 tests/qemu_log_check.py build/shell/display.log --shell
          python3 tests/shell_image_check.py build/shell
          sha256sum -c build/shell/before.sha256

      - name: Traverse nested directories and preview real VFS files
        run: |
          make BUILD=build/browser STORAGE_DURABILITY_PROOF=0 DISPLAY_PROOF=0 INPUT_PROOF=0
          truncate -s 64M build/browser/runtime.img
          mformat -i build/browser/runtime.img -F ::
          mcopy -i build/browser/runtime.img build/runtime.txt ::RUNTIME.TXT
          mmd -i build/browser/runtime.img ::SAVES ::SAVES/WORLDS
          python3 tests/browser_fixture.py build/browser
          mcopy -i build/browser/runtime.img build/browser/LEVEL.TXT ::SAVES/WORLDS/LEVEL.TXT
          for name in README.TXT EMPTY.TXT LONG.TXT BINARY.DAT; do
            mcopy -i build/browser/runtime.img build/browser/$name ::SAVES/$name
          done
          sha256sum build/browser/runtime.img > build/browser/before.sha256
          python3 tests/qemu_display_capture.py build/browser --browser
          python3 tests/qemu_log_check.py build/browser/display.log --shell
          python3 tests/shell_image_check.py build/browser --browser
          sha256sum -c build/browser/before.sha256

      - name: Page through a real 27-file directory and open later entries
        run: |
          make BUILD=build/paging all STORAGE_DURABILITY_PROOF=0 STORAGE_RECOVERY_PROOF=0 STORAGE_DIRTY_PROOF=0 STORAGE_CLEAN_PROOF=0 STORAGE_RENAME_PROOF=0 DISPLAY_PROOF=0 INPUT_PROOF=0
          truncate -s 64M build/paging/runtime.img
          mformat -i build/paging/runtime.img -F ::
          mcopy -i build/paging/runtime.img build/runtime.txt ::RUNTIME.TXT
          mmd -i build/paging/runtime.img ::MANY
          python3 tests/paging_fixture.py build/paging
          for file in build/paging/FILE*.TXT; do
            mcopy -i build/paging/runtime.img "$file" ::MANY/
          done
          sha256sum build/paging/runtime.img > build/paging/before.sha256
          python3 tests/qemu_display_capture.py build/paging --paging
          python3 tests/qemu_log_check.py build/paging/display.log --shell
          python3 tests/shell_image_check.py build/paging --paging
          sha256sum -c build/paging/before.sha256

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suirabox-kernel
          if-no-files-found: ignore
          path: |
            build/suirabox.iso
            build/suirabox.elf
            build/user-hello.elf
            build/user-child.elf
            build/runtime-fat32.img
            build/root-directory-seed.bin
            qemu.log
            build/recovery/*.img
            build/recovery/*.sha256
            qemu-recovery-*.log
            build/dirty/runtime.img
            build/dirty/expected.sha256
            qemu-dirty-*.log
            build/clean/runtime.img
            build/clean/seed.img
            build/clean/after-unmount.sha256
            qemu-clean-*.log
            build/rename/runtime.img
            build/rename/seed.img
            build/rename/after-rename.sha256
            qemu-rename*.log
            build/display/screen.ppm
            build/display/screen.png
            build/display/display.log
            build/display/qemu-host.log
            build/display/before-display.sha256
            build/boot-text/screen.ppm
            build/boot-text/screen.png
            build/boot-text/display.log
            build/boot-text/qemu-host.log
            build/boot-text/before.sha256
            build/input/screen.ppm
            build/input/screen.png
            build/input/before.ppm
            build/input/before.png
            build/input/display.log
            build/input/qemu-host.log
            build/input/before.sha256
            build/shell/*.ppm
            build/shell/*.png
            build/shell/display.log
            build/shell/qemu-host.log
            build/shell/before.sha256
            build/shell/user-hello.elf
            build/shell/user-child.elf
            build/shell/suirabox.iso
            build/browser/*.ppm
            build/browser/*.png
            build/browser/display.log
            build/browser/qemu-host.log
            build/browser/before.sha256
            build/browser/user-hello.elf
            build/browser/user-child.elf
            build/paging/*.ppm
            build/paging/*.png
            build/paging/*.TXT
            build/paging/display.log
            build/paging/qemu-host.log
            build/paging/before.sha256
            build/paging/user-hello.elf
            build/paging/user-child.elf
            build/paging/suirabox.iso
            build/paging/runtime.img
            build/runtime.txt

  ipc-proof:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download QEMU smoke artifact
        uses: actions/download-artifact@v4
        with:
          name: suirabox-kernel
          path: artifact

      - name: Verify IPC lifecycle
        run: python3 tests/ipc_log_check.py artifact/qemu.log
