name: SuiraBox CI

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            qemu-system-x86

      - name: Build ISO
        run: make

      - name: Validate Multiboot2 image
        run: make check

      - name: Inspect kernel layout
        run: |
          nm -nS build/suirabox.elf | grep -E 'stack_(bottom|top)|pml4|pdpt|pd$|bitmap|page_count|free_count|next_page' || true

      - name: Boot smoke test
        run: |
          set -o pipefail

          # Real FAT32 media for ATA -> block -> filesystem -> system VFS ->
          # userspace FILE_OPEN/READ verification. This is a partitionless
          # superfloppy image because the current FAT32 layer mounts a block
          # device at sector zero rather than parsing partition tables yet.
          truncate -s 64M build/runtime-fat32.img
          printf 'SUIRABOX-RUNTIME-FAT32\n' > build/runtime.txt
          mformat -i build/runtime-fat32.img -F ::
          mcopy -i build/runtime-fat32.img build/runtime.txt ::RUNTIME.TXT

          timeout 20s qemu-system-x86_64 \
            -m 256M \
            -boot d \
            -drive file=build/runtime-fat32.img,format=raw,if=ide,index=0,media=disk \
            -cdrom build/suirabox.iso \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu.log || test ${PIPESTATUS[0]} -eq 124

          grep -F "Kernel initialized." qemu.log
          grep -F "PCI: scanning bus/device/function space..." qemu.log
          grep -F "PCI: scan complete." qemu.log

          if grep -Fq "Display: framebuffer ready" qemu.log; then
            grep -F "Display: framebuffer mapped" qemu.log
            grep -F "Display: framebuffer clear OK" qemu.log
          else
            grep -F "Display: framebuffer unavailable; using fallback console" qemu.log
          fi

          grep -F "Storage: ATA primary master registered" qemu.log
          grep -F "Storage: FAT32 system mount /disk ready" qemu.log
          grep -F "Memory: PMM bootstrap free pages =" qemu.log
          grep -F "Memory: VMM map/translate/unmap OK" qemu.log
          grep -F "Memory: kernel heap alloc/free OK" qemu.log
          grep -F "CPU: GDT/TSS ready" qemu.log
          grep -F "Scheduler: selection/commit separation OK" qemu.log
          grep -F "Process/Syscall: model and dispatch OK" qemu.log
          grep -F "Syscall: int 0x80 user gate ready" qemu.log
          grep -F "Userspace: ELF + address-space + stack preparation OK" qemu.log
          grep -F "Userspace: first user thread scheduled" qemu.log
          grep -F "Timer: IRQ0 enabled" qemu.log
          grep -F "Phase 1 bootstrap complete." qemu.log

          grep -F "Syscall: ABI v1 userspace probe OK" qemu.log
          grep -F "Userspace: validated user pointer copy OK" qemu.log
          grep -F "Syscall: invalid user pointer rejected" qemu.log
          grep -F "Syscall: writable user pointer copy OK" qemu.log
          grep -F "Syscall: read-only user pointer write rejected" qemu.log

          grep -F "Handle: userspace process handle opened" qemu.log
          grep -F "Handle: type and rights query OK" qemu.log
          grep -F "Handle: close invalidated generation" qemu.log
          grep -F "Handle: stale generation rejected" qemu.log

          grep -F "VFS: system /boot module path open OK" qemu.log
          grep -F "File: boot module opened as FILE handle" qemu.log
          grep -F "File: invalid output pointer rejected before read" qemu.log
          grep -F "File: FILE handle read copied to userspace" qemu.log
          grep -F "File: FILE handle seek OK" qemu.log
          grep -F "Userspace: FILE handle read/seek lifecycle OK" qemu.log
          grep -F "File: generic VFS path opened as FILE handle" qemu.log
          grep -F "Userspace: generic VFS FILE_OPEN lifecycle OK" qemu.log
          grep -F "Userspace: runtime FAT32 file read through generic VFS OK" qemu.log
          grep -F "Spawn: executable staged from VFS file" qemu.log

          grep -F "Scheduler: timer preemption switched to user task" qemu.log
          grep -F "Userspace: entering ring3" qemu.log
          grep -F "Userspace: first syscall reached kernel" qemu.log
          grep -F "Scheduler: user task preempted back to kernel" qemu.log
          grep -F "Scheduler: saved user IRQ frame selected for resume" qemu.log
          grep -F "Userspace: resumed user thread reached syscall" qemu.log

          grep -F "Userspace: spawn syscall created child process" qemu.log
          grep -F "Scheduler: user task entered BLOCKED" qemu.log
          grep -F "Userspace: wait syscall blocked for child" qemu.log
          grep -F "Scheduler: cross-process CR3 switch verified" qemu.log
          grep -F "Scheduler: blocked user task descheduled" qemu.log
          grep -F "Userspace: child process PID syscall OK" qemu.log
          grep -F "Userspace: child requested process exit" qemu.log
          grep -F "Scheduler: blocked user task woke" qemu.log
          grep -F "Process: exited process resources reaped" qemu.log
          grep -F "Scheduler: woke blocked user task selected for resume" qemu.log
          grep -F "Userspace: parent wait resumed after child exit" qemu.log

          grep -F "Spawn: userspace request copied and validated" qemu.log
          grep -F "Spawn: general child process created" qemu.log
          grep -F "Spawn: parent blocked waiting for general child" qemu.log
          grep -F "Spawn: general child PID syscall OK" qemu.log
          grep -F "Spawn: general child requested process exit" qemu.log
          grep -F "Spawn: general child resources reaped" qemu.log
          grep -F "Spawn: general child wait completed" qemu.log

          grep -F "Spawn: VFS path request copied and validated" qemu.log
          grep -F "Spawn: VFS path child process created" qemu.log
          grep -F "Spawn: parent blocked waiting for VFS path child" qemu.log
          grep -F "Spawn: VFS path child PID syscall OK" qemu.log
          grep -F "Spawn: VFS path child requested process exit" qemu.log
          grep -F "Spawn: VFS path child resources reaped" qemu.log
          grep -F "Spawn: VFS path child wait completed" qemu.log

          grep -F "Userspace: concurrent child processes armed" qemu.log
          grep -F "Userspace: concurrent child processes completed" qemu.log

          grep -F "Scheduler: user task entered SLEEPING" qemu.log
          grep -F "Userspace: sleep syscall requested" qemu.log
          grep -F "Scheduler: sleeping user task descheduled" qemu.log
          grep -F "Scheduler: sleeping user task woke" qemu.log
          grep -F "Scheduler: woke user task selected for resume" qemu.log
          grep -F "Userspace: woke sleeping user thread reached syscall" qemu.log

          if grep -Fq "Exception:" qemu.log; then
            echo "unexpected kernel/user exception detected"
            grep -F "Exception:" qemu.log
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          log = Path("qemu.log").read_text(errors="replace")
          sequences = {
              "syscall-abi/user-pointer": [
                  "Userspace: first syscall reached kernel",
                  "Syscall: ABI v1 userspace probe OK",
                  "Userspace: validated user pointer copy OK",
                  "Syscall: invalid user pointer rejected",
                  "Syscall: writable user pointer copy OK",
                  "Syscall: read-only user pointer write rejected",
              ],
              "handle-generation": [
                  "Handle: userspace process handle opened",
                  "Handle: type and rights query OK",
                  "Handle: close invalidated generation",
                  "Handle: stale generation rejected",
              ],
              "vfs-file-handle": [
                  "VFS: system /boot module path open OK",
                  "File: boot module opened as FILE handle",
                  "File: invalid output pointer rejected before read",
                  "File: FILE handle read copied to userspace",
                  "File: FILE handle seek OK",
                  "Userspace: FILE handle read/seek lifecycle OK",
              ],
              "generic-vfs-file-open": [
                  "File: generic VFS path opened as FILE handle",
                  "Userspace: generic VFS FILE_OPEN lifecycle OK",
              ],
              "runtime-fat32-vfs": [
                  "Storage: ATA primary master registered",
                  "Storage: FAT32 system mount /disk ready",
                  "Userspace: runtime FAT32 file read through generic VFS OK",
              ],
              "legacy-wait/child/reap": [
                  "Spawn: executable staged from VFS file",
                  "Userspace: spawn syscall created child process",
                  "Scheduler: user task entered BLOCKED",
                  "Userspace: wait syscall blocked for child",
                  "Scheduler: cross-process CR3 switch verified",
                  "Scheduler: blocked user task descheduled",
                  "Userspace: child process PID syscall OK",
                  "Userspace: child requested process exit",
                  "Scheduler: blocked user task woke",
                  "Process: exited process resources reaped",
                  "Scheduler: woke blocked user task selected for resume",
                  "Userspace: parent wait resumed after child exit",
              ],
              "general-spawn/wait/reap": [
                  "Spawn: userspace request copied and validated",
                  "Spawn: general child process created",
                  "Spawn: parent blocked waiting for general child",
                  "Userspace: wait syscall blocked for child",
                  "Spawn: general child PID syscall OK",
                  "Spawn: general child requested process exit",
                  "Spawn: general child resources reaped",
                  "Spawn: general child wait completed",
              ],
              "vfs-path-spawn/wait/reap": [
                  "Spawn: VFS path request copied and validated",
                  "Spawn: VFS path child process created",
                  "Spawn: parent blocked waiting for VFS path child",
                  "Userspace: wait syscall blocked for child",
                  "Spawn: VFS path child PID syscall OK",
                  "Spawn: VFS path child requested process exit",
                  "Spawn: VFS path child resources reaped",
                  "Spawn: VFS path child wait completed",
              ],
              "concurrent-processes": [
                  "Userspace: concurrent child processes armed",
                  "Scheduler: user task entered SLEEPING",
                  "Userspace: sleep syscall requested",
                  "Scheduler: sleeping user task descheduled",
                  "Scheduler: sleeping user task woke",
                  "Scheduler: woke user task selected for resume",
                  "Userspace: concurrent child processes completed",
              ],
              "sleep/wake": [
                  "Scheduler: user task entered SLEEPING",
                  "Userspace: sleep syscall requested",
                  "Scheduler: sleeping user task descheduled",
                  "Scheduler: sleeping user task woke",
                  "Scheduler: woke user task selected for resume",
                  "Userspace: woke sleeping user thread reached syscall",
              ],
          }

          for name, markers in sequences.items():
              cursor = -1
              for marker in markers:
                  position = log.find(marker, cursor + 1)
                  if position < 0:
                      raise SystemExit(f"missing {name} marker: {marker}")
                  if position <= cursor:
                      raise SystemExit(f"out-of-order {name} marker: {marker}")
                  cursor = position
              print(f"ordered QEMU proof OK: {name}")
          PY

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suirabox-kernel
          if-no-files-found: ignore
          path: |
            build/suirabox.iso
            build/suirabox.elf
            build/user-hello.elf
            build/user-child.elf
            qemu.log
