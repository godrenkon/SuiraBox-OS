name: SuiraBox CI

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            qemu-system-x86

      - name: Prepare persistent FAT32 test disk
        run: |
          mkdir -p build
          truncate -s 64M build/test-disk.img
          mformat -F -i build/test-disk.img ::

      - name: Build ISO
        run: make USER_CFLAGS='-ffreestanding -fno-stack-protector -fno-pie -fno-builtin -mno-red-zone -m64 -mno-mmx -mno-sse -mno-sse2 -Wall -Wextra -Werror -O2 -ffunction-sections -fdata-sections -DSB_RUNTIME_SMOKE'

      - name: Check Core footprint and ISO resource boundary
        run: python3 tools/check_core_footprint.py

      - name: Validate Multiboot2 image
        run: make check

      - name: Check syscall ABI contract
        run: |
          gcc -Wall -Wextra -Werror -std=c11 -D_GNU_SOURCE -Ikernel -Iuserspace \
            tests/syscall_abi_host_test.c -o build/syscall-abi-host-test
          ./build/syscall-abi-host-test

      - name: Test filesystem syscall boundary
        run: |
          gcc -Wall -Wextra -Werror -std=c11 -D_GNU_SOURCE \
            -Ikernel -Ikernel/fs -Ikernel/mm -Ikernel/arch/x86_64 \
            tests/fs_syscall_host_test.c kernel/fs_syscall.c kernel/vfs.c \
            -o build/fs-syscall-host-test
          ./build/fs-syscall-host-test

      - name: Test file handle lifecycle
        run: |
          gcc -Wall -Wextra -Werror -std=c11 -D_GNU_SOURCE \
            -Ikernel -Ikernel/fs -Ikernel/mm -Ikernel/arch/x86_64 \
            tests/file_handle_host_test.c tests/file_handle_host_fat32_stub.c \
            kernel/fs_syscall.c kernel/vfs.c \
            -o build/file-handle-host-test
          ./build/file-handle-host-test

      - name: Inspect kernel layout
        run: |
          nm -nS build/suirabox.elf | grep -E 'stack_(bottom|top)|pml4|pdpt|pd$|bitmap|page_count|free_count|next_page' || true

      - name: Boot smoke test
        run: |
          set -o pipefail
          rm -f qemu.log qemu-debugcon.log
          timeout 30s qemu-system-x86_64 \
            -machine q35 \
            -cpu max \
            -m 512M \
            -vga std \
            -cdrom build/suirabox.iso \
            -drive file=build/test-disk.img,format=raw,if=ide \
            -boot order=d,menu=off \
            -nic user,model=e1000 \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Kernel initialized." qemu.log
          grep -F "PCI: scanning bus/device/function space..." qemu.log
          grep -F "PCI: scan complete." qemu.log
          grep -F "Memory: PMM bootstrap free pages =" qemu.log
          grep -F "Memory: VMM map/translate/unmap OK" qemu.log
          grep -F "Memory: kernel heap alloc/free OK" qemu.log
          grep -F "CPU: GDT/TSS ready" qemu.log
          grep -F "Scheduler: task table/round-robin selection OK" qemu.log
          grep -F "Process/Syscall: model and dispatch OK" qemu.log
          grep -E "Storage: (real block device \\+ FAT32 mount OK|persistent filesystem unavailable; continuing in fallback mode)" qemu.log
          grep -F "Syscall: int 0x80 user gate ready" qemu.log
          grep -F "Userspace: SB Desktop ELF + address-space + user thread preparation OK" qemu.log
          grep -F "Timer: IRQ0 enabled" qemu.log
          grep -F "Phase 1 bootstrap complete." qemu.log
          grep -F "Userspace: entering SB Desktop ring3" qemu.log
          grep -F "Userspace: ring3 syscall reached" qemu.log
          grep -F "Userspace: GUI framebuffer draw reached" qemu.log

      - name: Verify persistent filesystem runtime
        run: |
          set -o pipefail
          rm -f qemu-fs.log qemu-fs-host.log
          timeout 30s qemu-system-x86_64 \
            -machine pc \
            -cpu max \
            -m 512M \
            -vga std \
            -cdrom build/suirabox.iso \
            -drive file=build/test-disk.img,format=raw,if=ide \
            -boot order=d,menu=off \
            -nic user,model=e1000 \
            -serial file:qemu-fs.log \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu-fs-host.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Storage: ATA primary master registered" qemu-fs.log
          grep -F "Storage: persistent filesystem mounted" qemu-fs.log
          grep -F "Storage: persistence marker initialized" qemu-fs.log || grep -F "Storage: persistence marker verified" qemu-fs.log
          grep -F "Userspace: ring3 syscall reached" qemu-fs.log
          grep -F "Userspace: GUI framebuffer draw reached" qemu-fs.log

      - name: Framebuffer smoke test
        run: |
          set -o pipefail
          timeout 30s qemu-system-x86_64 \
            -machine q35 \
            -cpu max \
            -m 512M \
            -vga std \
            -cdrom build/suirabox.iso \
            -drive file=build/test-disk.img,format=raw,if=ide \
            -boot order=d,menu=off \
            -nic user,model=e1000 \
            -serial file:qemu-gui.log \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu-gui-host.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Display: framebuffer ready" qemu-gui.log
          grep -F "Display: framebuffer mapped" qemu-gui.log
          grep -F "Display: framebuffer clear OK" qemu-gui.log
          grep -F "Desktop: kernel fallback surface rendered" qemu-gui.log
          grep -E "Storage: (real block device \\+ FAT32 mount OK|persistent filesystem unavailable; continuing in fallback mode)" qemu-gui.log
          grep -F "Userspace: GUI framebuffer draw reached" qemu-gui.log
          grep -F "Memory: VMM map/translate/unmap OK" qemu-gui.log

      - name: Persistent storage first boot
        run: |
          set -o pipefail
          mformat -F -i build/test-disk.img ::
          rm -f qemu-storage-first.log
          timeout 30s qemu-system-x86_64 \
            -machine pc \
            -cpu max \
            -m 512M \
            -vga std \
            -cdrom build/suirabox.iso \
            -drive file=build/test-disk.img,format=raw,if=ide \
            -boot order=d,menu=off \
            -nic user,model=e1000 \
            -serial file:qemu-storage-first.log \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu-storage-first-host.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Storage: ATA primary master registered" qemu-storage-first.log
          grep -F "Storage: persistent filesystem mounted" qemu-storage-first.log
          grep -F "Storage: persistence marker initialized" qemu-storage-first.log
          grep -F "Storage: real block device + FAT32 mount OK" qemu-storage-first.log

      - name: Persistent storage reboot verification
        run: |
          set -o pipefail
          rm -f qemu-storage-second.log
          timeout 30s qemu-system-x86_64 \
            -machine pc \
            -cpu max \
            -m 512M \
            -vga std \
            -cdrom build/suirabox.iso \
            -drive file=build/test-disk.img,format=raw,if=ide \
            -boot order=d,menu=off \
            -nic user,model=e1000 \
            -serial file:qemu-storage-second.log \
            -display none \
            -no-reboot \
            -no-shutdown \
            2>&1 | tee qemu-storage-second-host.log || test ${PIPESTATUS[0]} -eq 124
          grep -F "Storage: ATA primary master registered" qemu-storage-second.log
          grep -F "Storage: persistent filesystem mounted" qemu-storage-second.log
          grep -F "Storage: persistence marker verified" qemu-storage-second.log
          grep -F "Storage: real block device + FAT32 mount OK" qemu-storage-second.log
          grep -F "Userspace: ring3 syscall reached" qemu-storage-second.log
          grep -F "Userspace: GUI framebuffer draw reached" qemu-storage-second.log

      - name: Upload kernel artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: suirabox-kernel
          path: |
            build/suirabox.iso
            build/suirabox.elf
            build/test-disk.img
            qemu.log
            qemu-fs.log
            qemu-fs-host.log
            qemu-gui.log
            qemu-gui-host.log
            qemu-storage-first.log
            qemu-storage-first-host.log
            qemu-storage-second.log
            qemu-storage-second-host.log
          if-no-files-found: warn