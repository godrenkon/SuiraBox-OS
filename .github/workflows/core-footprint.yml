name: SuiraBox Core Footprint

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  footprint:
    name: Core footprint policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check source footprint
        run: python3 tools/check_core_footprint.py
