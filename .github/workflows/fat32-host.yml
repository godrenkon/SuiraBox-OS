name: SuiraBox FAT32 Host Test

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  fat32-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile FAT32 host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Ikernel -Ikernel/fs tests/fat32_host_test.c kernel/block.c kernel/vfs.c kernel/fs/fat32.c -o /tmp/fat32-host-test
      - name: Run FAT32 host test
        run: /tmp/fat32-host-test
