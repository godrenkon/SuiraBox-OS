name: SuiraBox Externalized Payload Policy

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  externalized-payload-policy:
    name: Reject vendored optional resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify tracked payload policy
        run: sh scripts/check_externalized_payloads.sh
