name: SuiraBox Network Stack Host Test

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  net-stack-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Network Stack host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Ikernel tests/net_stack_host_test.c tests/net_device_host_mock.c kernel/net_stack.c kernel/dhcp.c kernel/net_arp.c -o /tmp/net-stack-host-test
      - name: Compile Network Routing host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Ikernel tests/net_route_host_test.c tests/net_device_host_mock.c kernel/net_route.c kernel/net_stack.c kernel/dhcp.c kernel/net_arp.c -o /tmp/net-route-host-test
      - name: Compile ARP host test
        run: gcc -std=c11 -Wall -Wextra -Werror -Ikernel tests/net_arp_host_test.c tests/net_device_host_mock.c kernel/net_arp.c kernel/net_stack.c kernel/dhcp.c -o /tmp/net-arp-host-test
      - name: Run Network Stack host test
        run: /tmp/net-stack-host-test
      - name: Run Network Routing host test
        run: /tmp/net-route-host-test
      - name: Run ARP host test
        run: /tmp/net-arp-host-test
