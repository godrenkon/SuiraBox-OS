set timeout=0
set default=0

# Request a deterministic graphical mode so the Multiboot2 framebuffer path can
# be exercised in QEMU. GRUB may choose a compatible fallback mode.
set gfxmode=1024x768x32
set gfxpayload=1024x768x32

menuentry "SuiraBox OS" {
    multiboot2 /boot/suirabox.elf
    module2 /boot/user-hello.elf user-hello
    boot
}
